name: release-manual-docs
on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        description: 'Version tag:' 
env:
  NODE_VERSION: 18
  PHP_VERSION: 8.4
jobs:
  docs-publish:
    if: github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup PHP ${{ env.PHP_VERSION }}
        run: |
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update -y
          sudo apt-get install -y php${{ env.PHP_VERSION }} php${{ env.PHP_VERSION }}-mbstring php${{ env.PHP_VERSION }}-xml php${{ env.PHP_VERSION }}-curl
          sudo update-alternatives --set php /usr/bin/php${{ env.PHP_VERSION }}
          php --version
      - name: Generate Docs
        run: |
          mkdir -p tools
          curl -sSL -o tools/phpDocumentor.phar \
            "https://github.com/phpDocumentor/phpDocumentor/releases/download/v$PHPDOC_VERSION/phpDocumentor.phar"
          echo "$PHPDOC_SHA256  tools/phpDocumentor.phar" | sha256sum --check --strict
          chmod +x tools/phpDocumentor.phar
          npm run document-check
          npm run document
        env:
          PHPDOC_VERSION: 3.10.0
          PHPDOC_SHA256: fe1e7c23ba3329aa6f19ac3c807446159a431a195ec5d9163b0c281a15105207
          SOURCE_TAG: ${{ github.event.inputs.tag }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.phpdoc/build
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
